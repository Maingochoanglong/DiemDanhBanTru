name: Dựng app Windows

on:
  push:
    branches: [main, master, "claude/**"]
    paths-ignore: ["tai-ve/**"]  # commit chỉ cập nhật file tải về thì không dựng lại
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Chạy test
        run: python -m pytest -q

      - name: Dựng file .exe
        run: pyinstaller --noconfirm --onefile --windowed --name DiemDanhBanTru run_app.py

      - name: Kiểm tra file .exe chạy được
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\DiemDanhBanTru.exe -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; Write-Error "App bị treo khi tự kiểm tra"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "App tự kiểm tra lỗi (mã $($p.ExitCode))"; exit 1 }
          Write-Host "App tự kiểm tra OK"

      - uses: actions/upload-artifact@v4
        with:
          name: DiemDanhBanTru-windows
          path: dist/DiemDanhBanTru.exe

      - name: Đăng bản mới nhất lên trang Releases
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Tải file DiemDanhBanTru.exe bên dưới rồi mở để dùng. Dựng từ commit $GITHUB_SHA (nhánh $GITHUB_REF_NAME)."
          sha="sha256:$(sha256sum dist/DiemDanhBanTru.exe | cut -d' ' -f1)"
          # API Releases của GitHub đôi khi trả HTTP 500 dù việc đã xong: kiểm tra lại file đã lên chưa
          uploaded() {
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/ban-moi-nhat" --jq '.assets[].digest' 2>/dev/null | grep -qx "$sha"
          }
          # Hàm gọi trong "if" nên bash không tự dừng khi lỗi: nối bằng && để lỗi bước nào cũng báo
          publish() {
            if gh release view ban-moi-nhat >/dev/null 2>&1; then
              # cập nhật bản đã có (không xóa rồi tạo lại)
              git tag -f ban-moi-nhat "$GITHUB_SHA" && git push -f origin refs/tags/ban-moi-nhat \
                && { uploaded || gh release upload ban-moi-nhat dist/DiemDanhBanTru.exe --clobber || uploaded; }
            else
              gh release create ban-moi-nhat dist/DiemDanhBanTru.exe \
                --target "$GITHUB_SHA" --prerelease \
                --title "Điểm danh bán trú — bản mới nhất" --notes "$notes" || uploaded
            fi
          }
          for i in 1 2 3 4; do
            if publish; then
              gh release edit ban-moi-nhat --notes "$notes" \
                || echo "::warning::Đã đăng file .exe mới, nhưng GitHub lỗi nên chưa sửa được dòng ghi chú của bản phát hành."
              exit 0
            fi
            echo "Đăng chưa được (lần $i), thử lại sau $((i * 20)) giây"; sleep $((i * 20))
          done
          exit 1

      - name: Cập nhật file tải về trong repo (tai-ve/DiemDanhBanTru.exe)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git fetch -q origin main --depth=1
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "main đã có commit mới hơn, lần dựng của commit đó sẽ cập nhật file tải về"; exit 0
          fi
          mkdir -p tai-ve
          cp dist/DiemDanhBanTru.exe tai-ve/DiemDanhBanTru.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tai-ve/DiemDanhBanTru.exe
          git commit -q -m "Cập nhật file tải về DiemDanhBanTru.exe (từ ${GITHUB_SHA::7}) [skip ci]"
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Đẩy chưa được (lần $i), thử lại sau $((i * 10)) giây"; sleep $((i * 10))
          done
          exit 1
