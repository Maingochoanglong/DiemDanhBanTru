name: Dựng app Windows

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Chạy test
        run: python -m pytest -q

      - name: Dựng file .exe
        run: pyinstaller --noconfirm --onefile --windowed --name DiemDanhBanTru run_app.py

      - name: Kiểm tra file .exe chạy được
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\DiemDanhBanTru.exe -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; Write-Error "App bị treo khi tự kiểm tra"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "App tự kiểm tra lỗi (mã $($p.ExitCode))"; exit 1 }
          Write-Host "App tự kiểm tra OK"

      - uses: actions/upload-artifact@v4
        with:
          name: DiemDanhBanTru-windows
          path: dist/DiemDanhBanTru.exe

      - name: Đăng bản mới nhất lên trang Releases
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Tải file DiemDanhBanTru.exe bên dưới rồi mở để dùng. Dựng từ commit $GITHUB_SHA (nhánh $GITHUB_REF_NAME)."
          publish() {
            if gh release view ban-moi-nhat >/dev/null 2>&1; then
              # cập nhật bản đã có (không xóa rồi tạo lại, tránh hỏng khi API GitHub lỗi giữa chừng)
              # (gọi trong "if" nên bash không tự dừng khi lỗi: nối bằng && để lỗi bước nào cũng báo)
              git tag -f ban-moi-nhat "$GITHUB_SHA" && git push -f origin refs/tags/ban-moi-nhat \
                && gh release upload ban-moi-nhat dist/DiemDanhBanTru.exe --clobber \
                && gh release edit ban-moi-nhat --notes "$notes"
            else
              gh release create ban-moi-nhat dist/DiemDanhBanTru.exe \
                --target "$GITHUB_SHA" --prerelease \
                --title "Điểm danh bán trú — bản mới nhất" --notes "$notes"
            fi
          }
          for i in 1 2 3; do
            if publish; then exit 0; fi
            echo "Đăng chưa được (lần $i), thử lại sau $((i * 10)) giây"; sleep $((i * 10))
          done
          exit 1
