[project]
name = "diemdanhbantru"
version = "1.0.0"
description = "App điểm danh bán trú: kiểm tra tên HS vắng, tính suất ăn, ghi sổ Excel"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
# F: import / biến không dùng; ARG: tham số không dùng; ERA: mã cũ bị comment; PIE: cấu trúc thừa
select = ["F", "E9", "B", "UP", "ARG", "ERA", "PIE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]  # hàm giả trong test nhận đủ tham số như hàm thật
